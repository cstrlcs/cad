[project]
name = "gridfinity"
version = "0.1.0"
description = "Gridfinity baseplates, bins and a hardware box"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "build123d>=0.13.0",
    "ocp-vscode>=4.2.0",
]

[project.scripts]
gridfinity = "gridfinity:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
